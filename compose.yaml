services:
  brightcore:
    build: .
    ports:
      - "${PORT:-8000}:8000"
    environment:
      PORT: "8000"
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-BrightCore2026!}
      BRIGHTCORE_DB: /data/brightcore.sqlite3
      BRIGHTCORE_UPLOADS: /data/private_uploads
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-BrightCore Recruitment Team}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-false}
      EMAIL_DRY_RUN: ${EMAIL_DRY_RUN:-false}
    volumes:
      - brightcore_data:/data
    restart: unless-stopped

volumes:
  brightcore_data:
